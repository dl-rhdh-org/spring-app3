apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: spring-demos3
  description: System for spring-app3 Spring Boot demo
spec:
  owner: group:default/devteam1
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: spring-app3
  description: Spring Boot backend demo (build + deploy)
  annotations:
    github.com/project-slug: dl-rhdh-org/spring-app3
    backstage.io/source-location: url:https://github.com/dl-rhdh-org/spring-app3
    backstage.io/kubernetes-id: spring-app3
    backstage.io/kubernetes-namespace: spring-demos3
    # Image Registry (Quay) tab — must match a Quay repo the plugin can read
    quay.io/repository-slug: openshifttest/hello-openshift
    argocd/app-name: spring-app3
    argocd/app-namespace: openshift-gitops
    argocd/instance-name: main
    backstage.io/techdocs-ref: dir:.
    servicenow.com/entity-id: spring-app3
  tags:
    - spring-boot
    - java
    - maven
    - github-actions
    - demo
  links:
    - url: https://github.com/dl-rhdh-org/spring-app3
      title: GitHub Repository
      icon: github
    - url: https://github.com/dl-rhdh-org/spring-app3/actions
      title: GitHub Actions
      icon: github
    - url: https://openshift-gitops-server-openshift-gitops.apps.cluster-4z99r.dyn.redhatworkshops.io/applications/spring-app3
      title: Argo CD
      icon: dashboard
    - url: https://spring-app3-spring-demos3.apps.cluster-4z99r.dyn.redhatworkshops.io
      title: OpenShift Route
      icon: web
      type: website
    - url: https://console-openshift-console.apps.cluster-4z99r.dyn.redhatworkshops.io/k8s/cluster/projects/spring-demos3
      title: OpenShift Project
      icon: catalog
    - url: https://quay.io/repository/openshifttest/hello-openshift
      title: Demo image (Quay)
      icon: catalog
spec:
  type: service
  lifecycle: experimental
  owner: group:default/devteam1
  system: spring-demos3
