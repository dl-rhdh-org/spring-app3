# Namespace is created by Argo (CreateNamespace=true) or exists already.
# Do not include a Namespace object here: AppProjects from argocd:create-resources
# deny cluster-scoped resources, which causes "Namespace is not permitted" / Missing.
---
# Allow OpenShift GitOps to manage resources in this namespace (sync before workloads)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-application-controller-admin
  namespace: spring-demos3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app3
  namespace: spring-demos3
  labels:
    app: spring-app3
    app.kubernetes.io/part-of: spring-app3
    app.openshift.io/runtime: spring-boot
    backstage.io/kubernetes-id: spring-app3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app3
  template:
    metadata:
      labels:
        app: spring-app3
        app.kubernetes.io/part-of: spring-app3
        app.openshift.io/runtime: spring-boot
        backstage.io/kubernetes-id: spring-app3
    spec:
      containers:
        - name: app
          # Demo image — replace with Quay-built image once CI push is enabled
          # Tag "latest" does not exist on this repo; use a real tag.
          image: quay.io/openshifttest/hello-openshift:1.2.0
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: spring-app3
  namespace: spring-demos3
  labels:
    app: spring-app3
    backstage.io/kubernetes-id: spring-app3
spec:
  selector:
    app: spring-app3
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spring-app3
  namespace: spring-demos3
  labels:
    app: spring-app3
    backstage.io/kubernetes-id: spring-app3
spec:
  to:
    kind: Service
    name: spring-app3
  port:
    targetPort: http
  tls:
    termination: edge
